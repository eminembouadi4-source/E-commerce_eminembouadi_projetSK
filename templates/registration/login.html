{% extends 'base.html' %}

{% block title %}Connexion - E-commerce{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto; padding: 0 1rem;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; color: #333;"> Connexion</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Nom d'utilisateur</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Mot de passe</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                Se connecter
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e9ecef;">
            <p>Pas de compte ? <a href="{% url 'register' %}" style="color: #667eea; text-decoration: none;">Créer un compte</a></p>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(element => {
        element.classList.add('form-control');
    });
</script>
{% endblock %}
